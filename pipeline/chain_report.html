<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐题识别对照</title>
<style>
:root{--ink:#182530;--muted:#637383;--line:#dde4e8;--human:#475569;--old:#2563eb;--new:#7c3aed}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:var(--ink);font:15px system-ui,"Microsoft YaHei"}button,select,input{font:inherit;border:1px solid var(--line);background:white;border-radius:7px;padding:9px 12px;cursor:pointer}button.active{background:#182530;color:white}header{background:white;padding:20px 28px;border-bottom:1px solid var(--line)}h1{font-size:25px;margin:0 0 6px}h2{font-size:18px}.muted{color:var(--muted);font-size:13px;line-height:1.7}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.main{padding:0 28px 28px}.metrics{display:flex;gap:16px;margin:18px 0}.metric{background:white;padding:16px 22px;border:1px solid var(--line);border-radius:9px;flex:1}.metric b{display:block;font-size:26px;margin-top:6px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{border:1px solid var(--line);background:white;border-radius:10px;padding:14px;cursor:pointer}.card img{width:100%;height:210px;object-fit:contain;margin:10px 0}.card:hover{border-color:#64748b}.tag{display:inline-block;border-radius:4px;padding:3px 7px;font-size:12px;background:#eef2f5}.bad{color:#b42318;background:#fff0ed}.good{color:#16734a;background:#edf8f1}.unknown{color:#8b6500;background:#fff8df}dialog{width:98vw;max-width:1900px;height:96vh;padding:0;border:1px solid var(--line);border-radius:12px}dialog::backdrop{background:#14202e99}.top{position:sticky;top:0;z-index:9;background:white;padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.top strong{flex:1}.workspace{display:grid;grid-template-columns:43% 57%;height:calc(96vh - 63px)}.map-panel{padding:14px;overflow:auto;border-right:1px solid var(--line);background:#e9edf1}.map-controls{position:sticky;top:-14px;background:#e9edf1;padding:6px 0 12px;z-index:2}.map-wrap{background:white}.map-wrap svg{width:100%;display:block}.right{overflow:auto;background:white}.modelbar{display:grid;grid-template-columns:repeat(3,1fr);background:#f8fafb;border-bottom:1px solid var(--line)}.modelbar>div{padding:13px;border-top:4px solid;min-width:0}.modelbar small{display:block;font-size:11px;line-height:1.6;overflow-wrap:anywhere;color:var(--muted)}.rowlist{padding:0 14px 24px}.row{padding:14px 0;border-bottom:1px solid var(--line);scroll-margin-top:10px}.row.selected{background:#f1f5fa;outline:2px solid #94a3b8;outline-offset:4px}.row-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}.strip{display:block;max-width:100%;height:62px;object-fit:contain;object-position:left;background:#fafafa;margin:8px 0}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}.cell b{display:block;font-size:19px;margin:5px 0}.cell small{display:block;color:var(--muted);line-height:1.65}.cell .wrong{color:#b42318}.cell .correct{color:#16734a}.cell img{max-width:100%;height:46px;object-fit:contain;object-position:left}.rowfilter{padding:12px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:3}.empty{padding:20px;color:var(--muted)}details{margin:15px 0;background:white;padding:12px;border:1px solid var(--line);border-radius:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#2563eb}.legacy img{max-width:100%}.legend{display:flex;gap:14px;margin:8px 0;font-size:12px}.legend span:before{content:'━';margin-right:5px}svg .target{cursor:pointer}svg text{font-family:system-ui,"Microsoft YaHei";paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round}@media(max-width:1000px){.workspace{grid-template-columns:1fr;height:auto}.map-panel{max-height:48vh}.right{overflow:visible}.modelbar small{font-size:10px}.main{padding:0 12px}.metrics{flex-wrap:wrap}.metric{min-width:160px}.compare{gap:4px}.cell{padding:6px}}
</style>
<header><h1>试卷识别 · 逐题对照</h1><div class="muted">人工记录、当前部署、候选组合分别查看。点击题目或原图框，立即对应题号与选择结果。</div></header>
<div class="main"><div class="metrics" id="metrics"></div><div class="muted" id="limits"></div><details><summary>模型来源与测试结论</summary><div id="models"></div><p id="gate"></p><a href="results.json">原始结果</a> · <a href="summary.md">完整结论</a></details><div class="toolbar"><select id="subject"></select><select id="filter"><option value="all">全部试卷</option><option value="bad">有不一致 / 遗漏 / 多框</option><option value="unknown">题号参照不完整</option><option value="good">逐题一致</option></select><span id="count" class="muted"></span></div><div class="cards" id="cards"></div></div><dialog id="detail"></dialog>
<script>
const DATA=__DATA__, $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS={human:'#475569',deployed:'#2563eb',candidate:'#7c3aed'},LABELS={human:'我的手标',deployed:'当前部署',candidate:'候选组合'};
let activePage=null,source='candidate',selected=-1,rowMode='all',mapMode='rows';
const answer=x=>x===null||x===undefined?'未知':x===''?'空白':x, no=x=>x===null||x===undefined?'未知':x===0?'未读出':x;
const file=k=>(DATA.models[k]?.path||'未提供').split(/[\\/]/).pop();
const mismatch=r=>!r.candidate||(r.no!==null&&r.no!==r.candidate.no)||(r.answer!==null&&r.answer!==r.candidate.answer);
const state=p=>p.candidate.rows-p.candidate.matched_rows||p.candidate.joint_correct<p.candidate.joint_known||p.candidate.extra_rows||['m1','m2'].some(s=>Object.values(p[s]).some(v=>v.missed||v.extra))?'bad':p.candidate.number_known<p.candidate.rows?'unknown':'good';
const metric=DATA.summary['全部'];$('metrics').innerHTML=[['整页试卷',DATA.pages.length],['当前答案一致',`${metric.deployed.answer_correct} / ${metric.deployed.answer_known}`],['候选答案一致',`${metric.candidate.answer_correct} / ${metric.candidate.answer_known}`],['候选题号＋答案一致',`${metric.candidate.joint_correct} / ${metric.candidate.joint_known}`]].map(([a,b])=>`<div class="metric">${a}<b>${b}</b></div>`).join('');
$('limits').textContent='与现有人工记录比较，人工记录也可能有误。'+DATA.limitations.join(' ');$('gate').textContent='本轮结论：'+(DATA.gate.pass?'通过':'待处理，未进入M3训练。')+DATA.gate.reasons.join('；');
$('models').innerHTML=Object.entries(DATA.models).map(([k,v])=>`<p><b>${esc(k)}</b>：${esc(v.path)}<br><small>SHA256 ${esc(v.sha256)}</small></p>`).join('');
$('subject').innerHTML=['全部学科',...Object.keys(DATA.summary).filter(x=>x!=='全部')].map(x=>`<option>${x}</option>`).join('');
function render(){let ps=DATA.pages.filter(p=>($('subject').value==='全部学科'||p.subject===$('subject').value)&&($('filter').value==='all'||state(p)===$('filter').value));$('count').textContent=`${ps.length} 张试卷`;$('cards').innerHTML=ps.map(p=>`<article class="card" data-page="${p.index}"><strong>${esc(p.subject)}</strong> <span class="tag ${state(p)}">${{bad:'待核对',unknown:'参照不完整',good:'逐题一致'}[state(p)]}</span><div class="muted">${esc(p.name)}</div><img loading="lazy" src="${p.view.raw}"><div>候选答案 ${p.candidate.answer_correct}/${p.candidate.answer_known} · 漏配 ${p.candidate.rows-p.candidate.matched_rows}</div></article>`).join('');document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>show(+el.dataset.page));}
function modelColumn(k,p){let text=k==='human'?'已审日志中的题号与答案；不是模型预测。':k==='deployed'?`题号：${file('digit')}<br>答案：${file('choice')}`:`题号：${file('candidate_digit')}<br>答案：${file(p.subject==='英语'?'english_choice':'candidate_choice')}`;return `<div style="border-color:${COLORS[k]}"><strong style="color:${COLORS[k]}">${LABELS[k]}</strong><small>${text}</small></div>`;}
function show(i){activePage=DATA.pages.find(p=>p.index===i);selected=-1;rowMode='all';source='candidate';const p=activePage;$('detail').innerHTML=`<div class="top"><button id="prev">上一张</button><strong>${esc(p.subject)} · ${esc(p.name)}</strong><button id="next">下一张</button><button id="close">关闭</button></div><div class="workspace"><section class="map-panel"><div class="map-controls"><b>原图定位</b><div class="toolbar" id="sources">${['human','deployed','candidate'].map(k=>`<button data-source="${k}">${LABELS[k]}</button>`).join('')}</div><div class="legend"><span style="color:var(--human)">手标</span><span style="color:var(--old)">当前部署</span><span style="color:var(--new)">候选组合</span></div><div class="muted">每次只显示一组识别框。实线为答案框，虚线为配对题号框；文字是本组的“题号 / 答案”。点击框定位右侧对应行。</div><button id="zoomSelected">放大所选题</button> <button id="zoomAll">查看整页</button></div><div class="map-wrap" id="map"></div><details class="legacy"><summary>原检测叠图与M1 / M2权重（辅助诊断）</summary><p class="muted">下列为旧版检测图：绿色=人工框，紫色=检测框，橙色=M2题号框。两组CNN共用同一次M1/M2检测。此处不表示各CNN识别结果。</p><p class="muted">M1：${esc(file('m1'))}<br>M2：${esc(file('m2'))}</p><img loading="lazy" src="${p.assets.page}">${p.assets.zones.map(x=>`<img loading="lazy" src="${x}">`).join('')}</details></section><section class="right"><div class="modelbar">${['human','deployed','candidate'].map(k=>modelColumn(k,p)).join('')}</div><div class="rowfilter"><button id="allRows" class="active">全部题目</button><button id="badRows">仅不一致 / 漏配</button><span id="rowCount" class="muted"></span></div><div class="rowlist" id="rows"></div></section></div>`;document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{source=b.dataset.source;drawMap()});$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>show((i+DATA.pages.length-1)%DATA.pages.length);$('next').onclick=()=>show((i+1)%DATA.pages.length);$('allRows').onclick=()=>{rowMode='all';drawRows()};$('badRows').onclick=()=>{rowMode='bad';drawRows()};$('zoomSelected').onclick=()=>zoom(true);$('zoomAll').onclick=()=>zoom(false);drawRows();drawMap();if(!$('detail').open)$('detail').showModal();}
function cell(r,k,i){const p=r[k];if(k==='human')return `<div class="cell"><small style="color:${COLORS[k]};font-weight:700">${LABELS[k]}</small><small>题号</small><b>${no(r.no)}</b><small>人工答案</small><b>${answer(r.answer)}</b><small>${r.no===null?'没有可靠题号参照':'来自已审记录'}</small></div>`;if(!p)return `<div class="cell"><small style="color:${COLORS[k]};font-weight:700">${LABELS[k]}</small><b class="wrong">未配出</b><small>该组没有匹配到这道人工作答行；并非空白答案。</small></div>`;let n=r.no===null?'':p.no===r.no?'correct':'wrong',a=r.answer===null?'':p.answer===r.answer?'correct':'wrong';return `<div class="cell"><small style="color:${COLORS[k]};font-weight:700">${LABELS[k]}</small><small>题号 <span class="${n}">${no(p.no_raw)} → ${no(p.no)}</span></small><b class="${a}">${answer(p.answer)}</b><small>答案 · ${a==='correct'?'与手标一致':a==='wrong'?'与手标不一致':'无参照'}</small><small>${p.valid?'有效输出':'需人工核对'}${p.no_raw!==p.no?' · 题号被序列纠正':''}</small>${r.view[k]?`<small>实际答案识别输入</small><img loading="lazy" src="${r.view[k]}">`:''}</div>`;}
function drawRows(){let rows=activePage.truth_rows.map((r,i)=>({r,i})).filter(({r})=>rowMode==='all'||mismatch(r));$('rows').innerHTML=rows.map(({r,i})=>`<section class="row" id="row-${i}" data-row="${i}"><div class="row-head"><button data-locate="${i}">定位 #${i+1}</button><strong>人工题号 ${no(r.no)}</strong><span class="tag ${mismatch(r)?'bad':'good'}">${mismatch(r)?'待核对':'与手标一致'}</span></div><div class="muted">人工参照原图（题号＋选项）</div><img class="strip" loading="lazy" src="${r.view.reference}"><div class="compare">${['human','deployed','candidate'].map(k=>cell(r,k,i)).join('')}</div></section>`).join('')||'<div class="empty">此页没有已知的逐题不一致。多框或未知题号请在原图与检测诊断中核对。</div>';$('rowCount').textContent=`${rows.length} / ${activePage.truth_rows.length} 行 · 额外配出：当前 ${activePage.deployed.extra_rows||0} / 候选 ${activePage.candidate.extra_rows||0}`;$('allRows').classList.toggle('active',rowMode==='all');$('badRows').classList.toggle('active',rowMode==='bad');document.querySelectorAll('[data-locate]').forEach(b=>b.onclick=()=>selectRow(+b.dataset.locate,true));}
function selectRow(i,focus){selected=i;if(!$('row-'+i)){rowMode='all';drawRows()}document.querySelectorAll('.row.selected').forEach(e=>e.classList.remove('selected'));$('row-'+i)?.classList.add('selected');$('row-'+i)?.scrollIntoView({block:'nearest',behavior:'smooth'});drawMap();if(focus)zoom(true);}
function drawMap(){const p=activePage;document.querySelectorAll('[data-source]').forEach(b=>b.classList.toggle('active',b.dataset.source===source));const color=COLORS[source],fs=Math.max(17,p.view.width/65);let targets=p.truth_rows.map((r,i)=>({r:source==='human'?r:r[source],i})).filter(x=>x.r);if(source!=='human'){const used=new Set(targets.map(x=>JSON.stringify(x.r.box)));(p.predictions[source]||[]).forEach(r=>{if(!used.has(JSON.stringify(r.box)))targets.push({r,i:-1})})}let shapes=targets.map(({r,i})=>{const b=r.box,active=i===selected;let nbox=source==='human'?r.view.num_global:r.num_global;return `<g class="target" data-hit="${i}" opacity="${selected<0||active?1:.45}"><rect x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}" fill="${active?color+'18':'transparent'}" stroke="${color}" stroke-width="${active?6:3}"/>${nbox?`<rect x="${nbox[0]}" y="${nbox[1]}" width="${nbox[2]-nbox[0]}" height="${nbox[3]-nbox[1]}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="7 4"/>`:''}<text x="${b[0]}" y="${b[1]-5}" fill="${color}" font-size="${fs}" font-weight="700">${i<0?'额外配出':`#${i+1}`} · ${no(r.no)} / ${answer(r.answer)}</text></g>`}).join('');$('map').innerHTML=`<svg id="pageSvg" viewBox="0 0 ${p.view.width} ${p.view.height}" xmlns="http://www.w3.org/2000/svg"><image href="${p.view.raw}" width="${p.view.width}" height="${p.view.height}"/>${shapes}</svg>`;document.querySelectorAll('[data-hit]').forEach(e=>e.onclick=()=>{if(+e.dataset.hit>=0)selectRow(+e.dataset.hit,true)});}
function zoom(on){const p=activePage;let svg=$('pageSvg');svg.querySelectorAll('text').forEach(e=>{e.style.display=!on||e.parentElement.dataset.hit===String(selected)?'':'none';e.style.fontSize=on?'14px':''});if(!on||selected<0){svg.setAttribute('viewBox',`0 0 ${p.view.width} ${p.view.height}`);return}let r=p.truth_rows[selected],b=(source==='human'?r:r[source])?.box||r.box,x=Math.max(0,b[0]-80),y=Math.max(0,b[1]-70),w=Math.min(p.view.width-x,Math.max(450,b[2]-b[0]+130)),h=Math.min(p.view.height-y,Math.max(200,b[3]-b[1]+130));svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);}
$('subject').onchange=render;$('filter').onchange=render;render();
</script></html>
