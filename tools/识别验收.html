<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>试卷识别验收</title>
<link rel="stylesheet" href="/asset/vendor/katex/katex.min.css">
<script defer src="/asset/vendor/katex/katex.min.js"></script>
<style>
:root{
  --bg:#F6F4F0; --surface:#FFFFFF; --surface-soft:#FAF8F5; --canvas:#EFECE6;
  --line:rgba(28,25,23,0.09); --line-strong:rgba(28,25,23,0.16);
  --text:#1C1917; --text-2:#44403C; --muted:#78716C;
  --brand:#0F6E56; --brand-hover:#0B5542; --brand-light:#ECFDF5; --brand-bd:#A7F3D0;
  --amber:#B45309; --amber-bg:#FEF3C7; --amber-bd:#FDE68A;
  --indigo:#4F46E5; --indigo-bg:#EEF2FF;
  --danger:#DC2626; --danger-bg:#FEF2F2; --danger-bd:#FECACA;
  --shadow-xs:0 1px 2px rgba(28,25,23,.04);
  --shadow-sm:0 2px 10px rgba(28,25,23,.05), 0 1px 2px rgba(28,25,23,.04);
  --shadow-md:0 10px 28px rgba(28,25,23,.08), 0 2px 6px rgba(28,25,23,.04);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--text); background:var(--bg); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,select,textarea,input{font:inherit}
button,select{
  border:1px solid var(--line-strong); background:#fff; border-radius:10px;
  padding:8px 14px; color:var(--text-2); cursor:pointer; font-weight:600;
  transition:all .15s ease;
}
button:hover:not(:disabled),select:hover{border-color:rgba(28,25,23,.3);color:var(--text);background:var(--surface-soft)}
button:disabled{opacity:.38;cursor:default}
.primary,.active{
  background:var(--brand)!important; border-color:var(--brand)!important; color:#fff!important;
  box-shadow:0 2px 8px rgba(15,110,86,.22);
}
.primary:hover:not(:disabled){background:var(--brand-hover)!important;border-color:var(--brand-hover)!important}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover:not(:disabled){background:rgba(28,25,23,.05);border-color:transparent;color:var(--text)}
.btn-ok{background:var(--brand-light);border-color:var(--brand-bd);color:var(--brand)}
.btn-ok:hover:not(:disabled){background:#D1FAE5;border-color:#6EE7B7;color:#065F46}
.btn-ok.is-active{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-err{background:#fff;border-color:var(--line-strong);color:var(--text-2)}
.btn-err:hover:not(:disabled){background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger)}
.btn-err.is-active{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger)}

.wrap{max-width:1440px;margin:0 auto;padding:28px 28px 48px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px;line-height:1.6}

/* 顶部总览头 */
.hero-header{
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:22px; border-bottom:1px solid var(--line);
}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-badge{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#0F6E56,#158E6F); color:#fff;
  display:grid;place-items:center; font-size:18px; font-weight:800;
  box-shadow:0 4px 12px rgba(15,110,86,.24); flex:none;
}
h1{font-size:24px;margin:0;letter-spacing:-0.02em;line-height:1.25}
h2{font-size:17px;margin:0;letter-spacing:-0.01em}
.subtitle{color:var(--muted);font-size:13.5px;margin-top:3px}

/* 协作领卷栏 */
.coop-pill{
  display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--brand-bd);
  border-radius:14px; padding:6px 8px 6px 14px;
  box-shadow:var(--shadow-xs);
}
.coop-pill label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:#065F46}
.coop-pill input{
  width:84px; padding:6px 10px; border:1px solid var(--brand-bd); border-radius:9px;
  background:var(--brand-light); color:var(--text); font-weight:700; outline:none;
}
.coop-pill input:focus{border-color:var(--brand);background:#fff}

/* 4 张核心概览卡片 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 26px}
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:18px 20px; box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;gap:4px;
}
.stat .label{font-size:13px;color:var(--muted);font-weight:600}
.stat b{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-0.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.stat.accent b{color:var(--brand)}
.stat.warn b{color:var(--amber)}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat-bar{height:6px;background:#EAE6DF;border-radius:999px;overflow:hidden;margin-top:6px}
.stat-bar i{display:block;height:100%;background:linear-gradient(90deg,#10B981,#0F6E56);border-radius:999px;transition:width .3s ease}

/* 试卷列表区 */
.section-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-bar h2{font-size:18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow-xs)}
.page-card{
  padding:12px; cursor:pointer; transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  display:flex;flex-direction:column;gap:10px;
}
.page-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:rgba(15,110,86,.35)}
.page-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.thumb{
  position:relative; height:240px; background:var(--canvas);
  display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:11px;
  border:1px solid rgba(28,25,23,.05);
}
.thumb img{height:100%;width:100%;object-fit:contain}
.thumb-badges{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;backdrop-filter:blur(6px);
}
.pill-lock{background:rgba(254,243,199,.94);color:#92400E;border:1px solid #FDE68A;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pill-mine{background:rgba(236,253,245,.95);color:#065F46;border:1px solid #A7F3D0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pill-done{background:rgba(15,110,86,.92);color:#fff}
.pill-todo{background:rgba(28,25,23,.68);color:#fff}

.card-info{padding:0 4px 2px}
.name{
  font-weight:700;font-size:14.5px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;
}
.meta-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{
  display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;
  font-size:12px;font-weight:600;background:#F3F0EA;color:var(--text-2);
}
.warning{background:var(--amber-bg);color:var(--amber)}
.good{background:var(--brand-light);color:var(--brand)}
.bad{background:var(--danger-bg);color:var(--danger)}

/* 异常/进行中提示条（仅在异常或运行中显示） */
.notice{
  background:#FFFBEB; border:1px solid var(--amber-bd); border-left:4px solid #D97706;
  padding:11px 15px; border-radius:10px; line-height:1.6; font-size:13.5px; color:#78350F;
  margin-bottom:16px;
}
.notice:empty{display:none}

/* 技术详情折叠区（默认收起，不干扰日常核对） */
.tech-fold{
  margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:12px 18px; color:var(--muted); font-size:13px;
}
.tech-fold summary{
  cursor:pointer; font-weight:600; color:var(--muted); list-style:none;
  display:flex;align-items:center;justify-content:space-between;user-select:none;
}
.tech-fold summary::after{content:"展开查看 ▾";font-size:12px}
.tech-fold[open] summary::after{content:"收起 ▴"}
.tech-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tech-line{font-size:12.5px;color:var(--muted);line-height:1.7}

/* ================= Apple 风格单张标框修改 Sheet（260ms 短促弹性动效） ================= */
.edit-sheet-backdrop{
  position:fixed;inset:0;z-index:60;
  background:rgba(15,23,42,.36);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;
  transition:opacity 240ms cubic-bezier(0.22, 1, 0.36, 1);
}
.edit-sheet-backdrop.open{opacity:1;pointer-events:auto}
.edit-sheet{
  width:min(1440px,96vw);height:min(900px,92vh);
  background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 28px 80px rgba(15,23,42,.28), 0 0 0 1px rgba(255,255,255,.5);
  display:flex;flex-direction:column;
  transform:translateY(22px) scale(.965);
  transition:transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
}
.edit-sheet-backdrop.open .edit-sheet{transform:translateY(0) scale(1)}
.edit-sheet-head{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;background:#faf8f3;border-bottom:1px solid var(--line);
}
.edit-sheet-head .meta{font-size:13px;color:var(--muted)}
.edit-sheet-frame{flex:1;width:100%;border:0;background:#111}
.zoom-hint{font-size:12px;color:var(--muted);background:var(--surface-soft);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}

/* ================= 详情核对工作区 ================= */
#detail{display:none}
html.review-mode{overflow:hidden;height:100%}
body.review-mode{position:fixed;inset:0;overflow:hidden;width:100%;height:100dvh;background:var(--bg)}
.review-mode .wrap{max-width:none;padding:0;height:100dvh;overflow:hidden}
.review-mode #detail{height:100dvh;display:flex!important;flex-direction:column;min-height:0}

.navsticky{
  flex:none; background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px 20px; display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  z-index:4;
}
.nav-group{display:inline-flex;align-items:center;gap:4px;background:var(--surface-soft);border:1px solid var(--line);border-radius:11px;padding:3px}
.nav-group button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:13.5px}
.nav-group button:hover:not(:disabled){background:#fff;box-shadow:var(--shadow-xs)}
#pageTitle{font-size:15px;font-weight:700;color:var(--text)}
.pos-pill{
  font-size:12.5px;font-weight:700;color:var(--muted);
  background:var(--surface-soft);border:1px solid var(--line);
  padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums;
}

#pageNotice{flex:none;max-height:72px;overflow:auto;padding:0 18px}
#pageNotice .notice{margin:10px 0 0}

.review-mode .workspace{
  flex:1;min-height:0;
  display:grid;grid-template-columns:minmax(380px,48%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);
  gap:14px; padding:14px 18px; overflow:hidden;
}

/* 左侧整页原卷面板 */
.map-panel{
  display:flex;flex-direction:column;min-height:0;height:100%;overflow:hidden;
  padding:14px;gap:10px;
}
.map-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:none}
.map-tools button{padding:5px 10px;font-size:12.5px;border-radius:8px}
.map-tools .zoom-readout{min-width:46px;text-align:center;font-size:12.5px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.map-toggle{font-size:12.5px;color:var(--text-2);display:inline-flex;gap:5px;align-items:center;cursor:pointer;user-select:none;margin-left:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;margin:0}
.legend span:before{content:'●';margin-right:4px}
.map{
  flex:1;min-height:120px;overflow:hidden;background:var(--canvas);border-radius:11px;
  border:1px solid var(--line);touch-action:none;cursor:grab;user-select:none;outline-offset:2px;
}
.map.dragging{cursor:grabbing}
.map svg{display:block;width:100%;height:100%}
.hit{cursor:pointer}
.map-answer{pointer-events:none}
.map-help{font-size:12px;color:var(--muted)}
.map-footer{flex:none;max-height:26vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.map-footer details{margin:0}
.map-footer summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2)}
.map-footer .feedback{margin-top:8px}
.map-footer textarea{min-height:52px}

/* 右侧逐题核对面板 */
.answer-panel{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.answer-toolbar{
  flex:none;margin-bottom:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;
}
#items{
  flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;
  scrollbar-gutter:stable;padding:2px 6px 32px 2px;
}
.item{
  padding:16px;margin-bottom:12px;
  border:1.5px solid var(--line); border-radius:14px;
  background:var(--surface); transition:border-color .15s, box-shadow .15s;
}
.item.selected{
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(15,110,86,.1), var(--shadow-sm);
}
.item-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.item-title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kind-pill{
  font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
}
.kind-choice{background:var(--brand-light);color:var(--brand)}
.kind-fill{background:var(--indigo-bg);color:var(--indigo)}
.kind-identity,.kind-unmatched{background:var(--amber-bg);color:var(--amber)}
.item-qno{font-size:16px;font-weight:800;color:var(--text)}
.btn-locate{padding:4px 10px;font-size:12px;border-radius:8px}

.comparison{display:grid;grid-template-columns:52% 1fr;gap:14px;align-items:start}
.item.fill .comparison{display:block}
.crop{
  width:100%;border:1px solid var(--line);border-radius:10px;
  max-height:380px;object-fit:contain;background:#FAF9F6;cursor:zoom-in;display:block;
}
.item.fill .crop{max-height:240px}
.item.fill .recognition-result{margin-top:10px}
.res-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.answer{
  background:var(--surface-soft);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;margin:0;overflow-wrap:anywhere;
}
.answer small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.choice-val{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:1px}
.text{white-space:pre-wrap;line-height:1.65}
.blank{color:#9CA3AF}
.unclear{color:var(--amber);font-weight:700}

.answer-row{
  display:flex;gap:10px;align-items:baseline;padding:8px 12px;
  background:var(--surface-soft);border:1px solid var(--line);
  border-radius:10px;margin:6px 0;min-width:0;
}
.sub-label{color:var(--text-2);font-size:13px;flex:none;min-width:40px;font-weight:700}
.blank-list{display:flex;gap:8px 16px;flex-wrap:wrap;min-width:0;flex:1}
.blank-chip{display:inline-flex;gap:5px;align-items:baseline;min-width:36px;max-width:100%;line-height:1.6;overflow-wrap:anywhere}
.blank-chip>small{color:var(--muted);font-size:12px;flex:none}
.blank-chip .text{display:inline;white-space:pre-wrap;min-width:0;line-height:1.6;font-weight:600;color:var(--text)}
.blank-chip .katex{font-size:1.05em}

/* 一键快速核对栏 */
.quick-review{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
}
.quick-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.quick-btns button{padding:5px 12px;font-size:13px;border-radius:9px}
.review-status{font-size:12px;color:var(--muted)}
.review-status.is-ok{color:var(--brand);font-weight:600}
.review-status.is-err{color:var(--danger);font-weight:600}

.feedback-drawer{
  margin-top:10px;padding:12px;background:var(--surface-soft);
  border:1px solid var(--line);border-radius:10px;
}
.feedback textarea{
  display:block;width:100%;min-height:60px;border:1px solid var(--line-strong);
  border-radius:9px;padding:9px 11px;margin:8px 0 0;resize:vertical;background:#fff;outline:none;
}
.feedback textarea:focus{border-color:var(--brand)}
.saved{color:var(--brand);font-size:12px;font-weight:600}

/* 原始技术信息折叠（默认隐藏细节） */
.dev-meta{margin-top:8px;font-size:12px;color:var(--muted)}
.dev-meta summary{cursor:pointer;color:var(--muted);font-size:12px;user-select:none}
.dev-meta-body{margin-top:6px;padding:8px 10px;background:var(--surface-soft);border-radius:8px;border:1px solid var(--line)}
.input-links{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.input-links button{padding:3px 9px;font-size:12px;border-radius:7px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:6px 0 0}

/* 弹窗 & Toast */
dialog{
  width:min(94vw,1360px);max-height:94vh;border:1px solid var(--line);
  border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.28);
}
dialog::backdrop{background:rgba(28,25,23,.58);backdrop-filter:blur(4px)}
dialog img{max-width:100%;display:block;margin:12px auto;border-radius:8px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px}
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(28,25,23,.92);backdrop-filter:blur(8px);color:#fff;
  padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  z-index:20;display:none;box-shadow:0 10px 28px rgba(0,0,0,.22);
}
#fatal:not(:empty){
  position:fixed;z-index:30;bottom:16px;left:18px;width:min(680px,calc(100vw - 36px));
  max-height:38vh;overflow:auto;background:#FEF2F2;border:2px solid #DC2626;
  border-radius:12px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-size:13px;
}
#fatal ol{padding-left:22px;margin:8px 0}
#fatal pre{font-size:12px;margin:4px 0}
.error{color:#B91C1C}
.diagnostic{font-size:12.5px;line-height:1.65;margin-top:8px;color:var(--muted)}
.diagnostic summary{cursor:pointer;color:var(--amber);font-weight:600}
.math-error{display:block;color:#B91C1C;background:#FEF2F2;padding:5px 8px;border-radius:6px}

@media(max-width:980px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .review-mode .workspace{grid-template-columns:minmax(260px,45%) minmax(0,1fr)}
  .comparison{grid-template-columns:1fr}
}
@media(max-width:640px){
  .wrap{padding:16px}
  .stats{grid-template-columns:1fr 1fr}
  .review-mode .workspace{display:flex;flex-direction:column;padding:10px}
  .map-panel{height:42%;flex:none;min-height:170px}
  .answer-panel{flex:1}
  .map-footer,.map-help,.legend,#pagePosition{display:none}
}
</style>
</head>
<body>
<main class="wrap">
  <section id="overview">
    <header class="hero-header">
      <div class="brand-row">
        <div class="brand-badge">验</div>
        <div>
          <h1>人工验收 · 试卷核对</h1>
          <div class="subtitle">对照左侧原卷核对识别结果；多人同时审核时，点右侧绿色按钮自动领卷不重复。</div>
        </div>
      </div>
      <div class="bar">
        <div class="coop-pill">
          <label>我是
            <input id="reviewerName" type="text" maxlength="16" placeholder="妈妈/爸爸" list="reviewerPresets">
            <datalist id="reviewerPresets"><option value="妈妈"></option><option value="爸爸"></option></datalist>
          </label>

<script>
'use strict';
const TOKEN='__TOKEN__', $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asset=p=>'/asset/'+p.split('/').map(encodeURIComponent).join('/');
const labels=['正确','识别错误','漏题／漏空','对应错误','看不清'];
let DATA,FEEDBACK,LOCKS={},pi=0,selected=null,focused=false,dirty=new Set(),view=null,drag=null,overviewScroll=0,lockedPageId=null;
const CLIENT_ID=(()=>{try{let id=sessionStorage.getItem('reviewClientId');if(!id){id='r_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);sessionStorage.setItem('reviewClientId',id)}return id}catch(_){return 'r_local'}})();
function reviewerName(){const el=$('reviewerName');return (el&&el.value?el.value:'').trim()}
try{const el=$('reviewerName');const urlReviewer=new URLSearchParams(location.search).get('reviewer');if(urlReviewer&&urlReviewer.trim()){localStorage.setItem('reviewUserName',urlReviewer.trim())}if(el){el.value=localStorage.getItem('reviewUserName')||'';el.onchange=()=>{try{localStorage.setItem('reviewUserName',reviewerName())}catch(_){}}}}catch(_){}
try{const cb=$('showConf');if(cb){cb.checked=localStorage.getItem('reviewShowConf')==='1';cb.onchange=()=>{try{localStorage.setItem('reviewShowConf',cb.checked?'1':'0')}catch(_){}if($('detail').style.display==='block')drawItems();}}}catch(_){}
function releasePageBeacon(){if(!lockedPageId)return;const payload=JSON.stringify({token:TOKEN,client_id:CLIENT_ID,page_id:lockedPageId});lockedPageId=null;try{if(typeof navigator!=='undefined'&&navigator.sendBeacon)navigator.sendBeacon('/api/release',new Blob([payload],{type:'application/json'}))}catch(_){}}
async function claimNextPage(){const r=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify({client_id:CLIENT_ID,user:reviewerName()||'成员'})});const d=await r.json();if(!r.ok)throw Error(d.error||'领卷失败');if(d.locks)LOCKS=d.locks;if(!d.key){toast(d.reason==='all_locked'?'剩余试卷正在被另一位核对中，请稍候再试':'太棒了，本批试卷已全部检查完！');renderPages();return}lockedPageId=d.key;const idx=DATA.pages.findIndex(p=>p.id===d.key);if(idx>=0){showPage(idx);toast('已为你锁定试卷：'+DATA.pages[idx].name)}}
if(typeof setInterval==='function'){setInterval(()=>{if(!lockedPageId)return;fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify({client_id:CLIENT_ID,user:reviewerName()||'成员',page_id:lockedPageId})}).then(r=>r.json()).then(d=>{if(d.locks)LOCKS=d.locks}).catch(()=>{})},30000)}
const pending=id=>!FEEDBACK.items[id]?.label;
const ownIssues=p=>p.issues.length+p.items.filter(i=>i.issues.length).length;
const pageUnchecked=p=>pending(p.id)&&p.items.some(i=>pending(i.id))||p.items.some(i=>pending(i.id));
const humanErrors=p=>[p.id,...p.items.map(i=>i.id)].filter(id=>FEEDBACK.items[id]?.label&&FEEDBACK.items[id].label!=='正确').length;
function issueText(value){return String(value).replace('M1未检测到区域，不能视为空白卷','未找到可识别的答题区').replace('题号或涂黑置信不足，需核对（空白不自动判错）','题号或涂黑结果待核对')}
const uiErrors=new Map();
function reportError(stage,error,location=''){
 const p=DATA?.pages?.[pi],where=location||(document.body.classList.contains('review-mode')?`${p?.name||''} / ${selected||p?.id||''}`:'整批总览');
 const message=error?.message||String(error),key=stage+'|'+where+'|'+message;
 uiErrors.set(key,{stage,where,message});
 $('fatal').innerHTML=`<div class="bar between"><strong>操作异常 · 请查看原因</strong><button id="dismissErrors">关闭提示</button></div><ol>${[...uiErrors.values()].slice(-20).map(e=>`<li><b>${esc(e.stage)}</b> · ${esc(e.where)}<pre>${esc(e.message)}</pre></li>`).join('')}</ol>`;
 $('fatal').setAttribute('role','alert');$('dismissErrors').onclick=()=>{uiErrors.clear();$('fatal').innerHTML=''};
}
window.addEventListener('error',e=>{if(e.target!==window&&e.target?.tagName){reportError('资源加载失败',e.target.currentSrc||e.target.src||e.target.href||e.target.tagName);return}reportError('页面脚本错误',`${e.message||'未知错误'}${e.filename?' · '+e.filename+':'+e.lineno:''}`)},true);
window.addEventListener('unhandledrejection',e=>{e.preventDefault();reportError('异步操作失败',e.reason||'未知错误')});
function choiceDiagnostic(item){
 if(!$('showConf')?.checked)return '';
 const r=item.recognition;
 if(!r)return `<div class="muted" style="font-size:12px;margin-top:6px">置信度：未记录</div>`;
 const number=r.number_conf??r.digit_conf,choice=r.choice_conf;
 const fmt=v=>typeof v==='number'&&Number.isFinite(v)?(v*100).toFixed(1)+'%':'未记录';
 const lowNum=typeof number==='number'&&number<.5;
 const lowChoice=typeof choice==='number'&&choice<.5;
 const numHtml=`<span style="${lowNum?'color:var(--amber);font-weight:700':''}">题号置信度 ${fmt(number)}</span>`;
 const choiceLabel=item.answer?'涂黑置信度':'最高涂黑分';
 const choiceHtml=`<span style="${lowChoice?'color:var(--amber);font-weight:700':''}">${choiceLabel} ${fmt(choice)}</span>`;
 return `<div style="margin-top:6px;padding:6px 10px;border-radius:8px;background:#f7f5f0;border:1px solid var(--line);font-size:12.5px;color:var(--muted)">${numHtml} · ${choiceHtml}${!item.answer?' · 未检出涂黑':''}</div>`;
}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>$('toast').style.display='none',3000)}
async function load(){if(dirty.size&&!confirm('还有未保存的反馈，刷新会保留在草稿中，是否继续？'))return;const r=await fetch('/api/state',{cache:'no-store'});const x=await r.json();if(!r.ok)throw Error(x.error);DATA=x.result;FEEDBACK=x.feedback;LOCKS=x.locks||{};renderOverview();if($('detail').style.display==='block')showPage(pi);}
function renderOverview(){
 const pages=DATA.pages,s=DATA.stats||{},all=pages.flatMap(p=>p.items);
 const choices=all.filter(i=>i.kind==='choice').length;
 const fills=all.filter(i=>i.kind==='fill').length;
 const checked=all.filter(i=>!pending(i.id)).length;
 const issuesCount=all.filter(i=>i.issues.length).length;
 const donePages=pages.filter(p=>!pageUnchecked(p)).length;
 const pct=all.length?Math.round(checked/all.length*100):0;

 $('stats').innerHTML=`
  <div class="stat">
    <span class="label">本批试卷</span>
    <b>${pages.length} <span style="font-size:15px;font-weight:600;color:var(--muted)">页</span></b>
    <span class="sub">选择题 ${choices} 道 · 填空大题 ${fills} 道</span>
  </div>
  <div class="stat accent">
    <span class="label">人工核对进度</span>
    <b>${checked} / ${all.length}</b>
    <div class="stat-bar"><i style="width:${pct}%"></i></div>
  </div>
  <div class="stat ${issuesCount?'warn':'accent'}">
    <span class="label">低置信度题</span>
    <b>${issuesCount} <span style="font-size:15px;font-weight:600;color:var(--muted)">道</span></b>
    <span class="sub">${issuesCount?'题号或涂黑置信度偏低（页内可开关查看具体数值）':'全部题目置信度正常'}</span>
  </div>
  <div class="stat">
    <span class="label">已核完试卷</span>
    <b>${donePages} / ${pages.length}</b>
    <span class="sub">${donePages===pages.length&&pages.length?'本批已全部核对完毕':'点击绿按钮自动领下一张'}</span>
  </div>`;

 const isAbnormal=DATA.status&&!/已完成/.test(DATA.status);
 $('notice').textContent=isAbnormal?('当前状态：'+DATA.status):'';
 $('techStatus').textContent='本批状态：'+DATA.status+(DATA.local_correction?' · 已补配选择题；耗时表保留原始测速记录。':'')+' · 豆包拼图 '+(s.api_success??0)+'/'+(s.grids??(DATA.grids||[]).length);
 $('metrics').textContent=`输入 token ${s.prompt_tokens??'—'} · 输出 token ${s.completion_tokens??'—'} · 并发 ${s.concurrency??'—'} · 本地检测 ${s.detection_sum_seconds??'—'}秒 · 墙钟 ${s.wall_seconds??'—'}秒 · 重试 ${s.attempts??'—'} 次 · 复用 ${s.reused??0}`;
 $('batchTitle').textContent=`本批试卷（${pages.length}${DATA.benchmark&&!DATA.benchmark.complete?' / '+DATA.benchmark.total_pages:''} 页）`;
 renderPages();
 renderBenchmark();
 renderStageProfile();
}
function renderBenchmark(){const b=DATA.benchmark;if(!b){$('benchmark').innerHTML='';return}const seconds=b.wall_seconds??b.elapsed_seconds??0;const duration=seconds>=60?`${Math.floor(seconds/60)}分${Math.round(seconds%60)}秒`:`${seconds.toFixed(1)}秒`;const values=[[b.timing_mode==='interrupted_resume'?(b.complete?'分段处理合计':'本次补跑耗时'):'本轮耗时',duration],['本地处理进度',`${b.processed_pages} / ${b.total_pages}`],['API累计token',((b.input_tokens||0)+(b.output_tokens||0)).toLocaleString()],['估算费用',`¥${Number(b.estimated_cost_cny||0).toFixed(4)}`]];$('benchmark').innerHTML=`<div class="stats" style="grid-template-columns:repeat(4,1fr);margin:8px 0">${values.map(([k,v])=>`<div class="stat"><span class="label">${esc(k)}</span><b style="font-size:20px">${esc(v)}</b></div>`).join('')}</div><div class="muted">${b.blocked?esc(b.status):b.complete?'本轮测试完成':'正在运行，点击刷新查看最新进度'} · high拼图 / CPU FP32 / 4并发 · 费用按实际usage及<a href="https://console.volcengine.com/ark/region%3Acn-beijing/docs/model-pricing" target="_blank" rel="noopener noreferrer">公开单价</a>估算，非账户扣费。${b.timing_mode==='interrupted_resume'?` 本地处理${b.local_wall_seconds.toFixed(1)}秒；本次补跑${b.resume_seconds.toFixed(1)}秒；不含调整额度等待，不是一次连续计时。`:''}${b.complete?` ${b.timing_mode==='interrupted_resume'?'分段合计均摊':'平均'}${b.seconds_per_page.toFixed(2)}秒/页，约¥${b.cost_per_1000_pages_cny.toFixed(2)}/千页。`:''}</div>`}
function renderStageProfile(){
 const b=DATA.benchmark;if(!b?.stage_profile)return;
 const labels={model_initialization:'首次模型加载',orientation:'方向检查',m1:'M1分区',m2:'M2选择题检测',m3:'M3大题检测',paddle_number:'Paddle题号',choice_reader:'涂黑识别',image_encoding_write:'图片编码与保存（含拼图）',local_page_total:'本地单页处理合计',packing:'拼图（含编码保存）',json_validation:'JSON解析与校验',result_merge:'结果合并'};
 $('benchmark').innerHTML+=`<details class="card" style="margin-top:10px;padding:12px"><summary style="cursor:pointer;font-weight:600">各环节实测耗时</summary><div class="muted" style="margin:6px 0">已转正工作图只检查方向，不二次旋转或倾斜校正。本地与API重叠；子项包含在合计中，不可直接相加。</div><table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr><th align="left">环节</th><th align="right">累计秒</th><th align="right">调用次数</th></tr></thead><tbody>${Object.entries(b.stage_profile).map(([k,v])=>`<tr><td style="padding:4px">${esc(labels[k]||k)}</td><td align="right">${v.seconds.toFixed(3)}</td><td align="right">${v.calls}</td></tr>`).join('')}<tr><td style="padding:4px">豆包请求阶段跨度（4并发）</td><td align="right">${b.api_phase_span_seconds.toFixed(3)}</td><td align="right">${b.api_requests}</td></tr><tr><td style="padding:4px">导入准备</td><td align="right">${b.imports_seconds.toFixed(3)}</td><td align="right">1</td></tr></tbody></table></details>`;
}
function renderPages(){
 let f=$('pageFilter').value;
 $('pages').innerHTML=DATA.pages.map((p,i)=>({p,i})).filter(({p})=>f==='all'||(f==='issues'?(ownIssues(p)>0||humanErrors(p)>0):pageUnchecked(p))).map(({p,i})=>{
  const lk=LOCKS[p.id];
  const lockPill=lk&&lk.client_id!==CLIENT_ID?`<span class="pill pill-lock">🔒 ${esc(lk.user)} 核对中</span>`:(lk&&lk.client_id===CLIENT_ID?'<span class="pill pill-mine">🔒 我正在看</span>':'<span></span>');
  const statusPill=pageUnchecked(p)?'<span class="pill pill-todo">待检查</span>':'<span class="pill pill-done">✓ 已核完</span>';
  const iss=ownIssues(p), errs=humanErrors(p);
  return `<article class="card page-card" data-page="${i}" tabindex="0" role="button" aria-label="打开 ${esc(p.name)}">
    <div class="thumb">
      ${p.thumbnail?`<img loading="lazy" src="${asset(p.thumbnail)}" alt="${esc(p.name)}">`:'<span class="muted">本页处理失败</span>'}
      <div class="thumb-badges">${lockPill}${statusPill}</div>
    </div>
    <div class="card-info">
      <div class="name" title="${esc(p.name)}">${esc(p.name)}</div>
      <div class="meta-row">
        <span class="tag">${p.items.length} 道题</span>
        ${iss?`<span class="tag warning">${iss} 项待核对</span>`:'<span class="tag good">无异常</span>'}
        ${errs?`<span class="tag bad">已标 ${errs} 处误</span>`:''}
      </div>
    </div>
  </article>`;
 }).join('')||'<div class="card empty">当前筛选下没有试卷</div>';
 document.querySelectorAll('[data-page]').forEach(e=>{e.onclick=()=>showPage(+e.dataset.page);e.onkeydown=v=>{if(v.key==='Enter')showPage(+e.dataset.page)}});
}
function visibleItems(){const f=$('itemFilter').value;return DATA.pages[pi].items.filter(i=>f==='all'||(f==='fill'||f==='choice'?i.kind===f:f==='issues'?(i.issues.length||FEEDBACK.items[i.id]?.label&&FEEDBACK.items[i.id].label!=='正确'):pending(i.id)))}
function showPage(index){
 if(index<0||index>=DATA.pages.length)return;
 if(!document.body.classList.contains('review-mode'))overviewScroll=window.scrollY||0;
 stopDrag();window.scrollTo(0,0);document.documentElement.classList.add('review-mode');
 pi=index;const p=DATA.pages[pi];document.body.classList.add('review-mode');
 $('overview').style.display='none';$('detail').style.display='block';$('pageTitle').textContent=p.name;
 $('pagePosition').textContent=`第 ${pi+1} / ${DATA.pages.length} 页`;
 $('pageNotice').innerHTML=p.issues.length?`<div class="notice">${p.issues.map(v=>esc(issueText(v))).join('<br>')}</div>`:'';
 $('prevPage').disabled=pi===0;$('nextPage').disabled=pi===DATA.pages.length-1;
 $('pageFeedback').innerHTML=feedbackForm(p.id);bindFeedback($('pageFeedback'));
 selected=visibleItems()[0]?.id||null;focused=false;view=null;
 drawItems();drawMap();$('items').scrollTop=0;
}
async function saveFeedbackValue(id,label,correction){
 const payload={id,label,correction,revision:FEEDBACK.revision};
 const who=reviewerName();if(who)payload.reviewer=who;
 const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify(payload)});
 const v=await r.json();if(!r.ok)throw Error(v.error);
 FEEDBACK=v;
 localStorage.removeItem('draft:'+FEEDBACK.run+':'+id);
 dirty.delete(id);
 renderOverview();
 return FEEDBACK.items[id];
}
function feedbackForm(id){
 const saved=FEEDBACK.items[id]||{};
 let draft;try{draft=JSON.parse(localStorage.getItem('draft:'+FEEDBACK.run+':'+id)||'null')}catch(e){reportError('读取反馈草稿失败',e,id)}
 const v=draft||saved;
 return `<div data-feedback="${id}"><div class="bar"><select aria-label="人工核对结论" class="label" style="padding:5px 10px;font-size:13px"><option value="">选择问题类型</option>${labels.map(l=>`<option value="${esc(l)}" ${v.label===l?'selected':''}>${l}</option>`).join('')}</select><button class="save primary" style="padding:6px 14px;font-size:13px">保存反馈</button><span class="saved">${draft?'有未保存草稿':saved.updated?'已保存 '+esc(saved.updated):''}</span></div><textarea aria-label="正确转录或漏题说明" placeholder="填写正确答案、漏题位置或问题说明（仅记录反馈，不修改训练数据）">${esc(v.correction||'')}</textarea></div>`;
}
function bindFeedback(root){
 root.querySelectorAll('[data-feedback]').forEach(form=>{
  const id=form.dataset.feedback,key='draft:'+FEEDBACK.run+':'+id;
  const remember=()=>{dirty.add(id);localStorage.setItem(key,JSON.stringify({label:form.querySelector('select').value,correction:form.querySelector('textarea').value}));form.querySelector('.saved').textContent='有未保存草稿'};
  form.querySelector('select').onchange=remember;
  form.querySelector('textarea').oninput=remember;
  form.querySelector('.save').onclick=async()=>{
   const button=form.querySelector('.save');button.disabled=true;
   try{
    const item=await saveFeedbackValue(id,form.querySelector('select').value,form.querySelector('textarea').value);
    form.querySelector('.saved').textContent='已保存 '+(item?.updated||'');
    updateCardReviewUI(id);
    toast('反馈已保存');
   }catch(e){form.querySelector('.saved').textContent='保存失败，草稿保留';reportError('保存人工反馈失败',e,id)}
   finally{button.disabled=false}
  };
 });
 root.querySelectorAll('[data-quick-ok]').forEach(btn=>{
  btn.onclick=async()=>{
   const id=btn.dataset.quickOk;btn.disabled=true;
   try{
    await saveFeedbackValue(id,'正确','');
    const card=$('item-'+id);
    const drawer=card?.querySelector('.feedback-drawer');
    if(drawer)drawer.style.display='none';
    const sel=card?.querySelector('select.label');if(sel)sel.value='正确';
    updateCardReviewUI(id);
    toast('已标记为「正确」');
   }catch(e){reportError('保存核对结果失败',e,id)}
   finally{btn.disabled=false}
  };
 });
 root.querySelectorAll('[data-quick-err]').forEach(btn=>{
  btn.onclick=()=>{
   const id=btn.dataset.quickErr;
   const card=$('item-'+id);
   const drawer=card?.querySelector('.feedback-drawer');
   if(!drawer)return;
   const show=drawer.style.display==='none';
   drawer.style.display=show?'block':'none';
   if(show){
    const sel=drawer.querySelector('select.label');
    if(sel&&(!sel.value||sel.value==='正确'))sel.value='识别错误';
    drawer.querySelector('textarea')?.focus();
   }
  };
 });
}
function updateCardReviewUI(id){
 const card=$('item-'+id);if(!card)return;
 const saved=FEEDBACK.items[id];
 const lbl=saved?.label||'';
 const okBtn=card.querySelector('[data-quick-ok]');
 const errBtn=card.querySelector('[data-quick-err]');
 const st=card.querySelector('.review-status');
 if(okBtn)okBtn.classList.toggle('is-active',lbl==='正确');
 if(errBtn)errBtn.classList.toggle('is-active',!!lbl&&lbl!=='正确');
 if(st){
  st.className='review-status'+(lbl==='正确'?' is-ok':lbl?' is-err':'');
  st.textContent=lbl?`已核对：${lbl}${saved.updated?' · '+saved.updated:''}`:'尚未核对';
 }
}
function answerHTML(item){
 const t=item.transcription;
 if(item.kind==='choice')return `<div class="answer"><small>第 ${esc(item.number||'?')} 题 · 识别选项</small><div class="choice-val">${item.answer?esc(item.answer):'<span class="unclear" style="font-size:15px">未检出选中项 · 请对照原卷</span>'}</div></div>${choiceDiagnostic(item)}`;
 if(!t)return `<div class="notice" style="margin:0">${esc(item.status)}：暂无转录。</div>`;
 if(item.kind==='identity')return ['name','sid'].map((k,i)=>`<div class="answer" style="margin-bottom:6px"><small>${i?'学号':'姓名'}</small><div class="text" style="font-weight:700">${esc(t[k]||'（空白）')}</div></div>`).join('');
 return Object.entries(t.answers).map(([sub,blanks])=>blanks['舍弃']==='舍弃'?`<div class="answer-row"><span class="sub-label">${sub==='无小题号'?'填空':`(${esc(sub)})`}</span><strong style="color:var(--amber)">含图，整小题舍弃</strong></div>`:`<div class="answer-row"><span class="sub-label">${sub==='无小题号'?'填空':`(${esc(sub)})`}</span><div class="blank-list">${Object.entries(blanks).map(([n,v])=>`<span class="blank-chip"><small title="空位原编号 ${esc(n)}">${/^[1-9]\d*$/.test(n)&&+n<=20?String.fromCodePoint(9311+(+n)):esc(n)}</small>${v===''?'<span class="blank">空白</span>':v==='看不清'?'<strong class="unclear">看不清</strong>':`<span class="text mathtext" data-value="${esc(v)}"></span>`}</span>`).join('')}</div></div>`).join('');
}
function drawItems(){
 const items=visibleItems();
 const kindName={fill:'填空大题',choice:'选择题',identity:'姓名学号',unmatched:'未配对'};
 $('items').innerHTML=items.map(i=>{
  const saved=FEEDBACK.items[i.id]||{};
  const lbl=saved.label||'';
  const openDrawer=dirty.has(i.id)||(!!lbl&&lbl!=='正确');
  const hasDev=i.grid||i.model_input||i.transcription;
  return `<article class="item ${i.kind} ${i.id===selected?'selected':''}" id="item-${i.id}">
   <div class="item-head">
     <div class="item-title-wrap">
       <span class="kind-pill kind-${i.kind}">${kindName[i.kind]||i.kind}</span>
       <span class="item-qno">${i.kind==='fill'||i.kind==='choice'?(i.number?`第 ${esc(i.number)} 题`:'题号待定'):kindName[i.kind]}</span>
       ${i.issues.map(v=>`<span class="tag warning">${esc(issueText(v))}</span>`).join('')}
     </div>
     <button class="btn-locate" data-locate="${i.id}">◎ 原卷定位</button>
   </div>
   <div class="comparison">
     <div><img class="crop" loading="lazy" src="${asset(i.crop)}" data-image="${esc(i.crop)}" alt="${i.id}原始裁图" title="点击放大查看"></div>
     <div class="recognition-result">
       <div class="res-label">系统识别结果</div>
       ${answerHTML(i)}
     </div>
   </div>
   <div class="quick-review">
     <div class="quick-btns">
       <button class="btn-ok ${lbl==='正确'?'is-active':''}" data-quick-ok="${i.id}">✓ 识别正确</button>
       <button class="btn-err ${lbl&&lbl!=='正确'?'is-active':''}" data-quick-err="${i.id}">✎ 有误 / 补充说明</button>
     </div>
     <span class="review-status ${lbl==='正确'?'is-ok':lbl?' is-err':''}">${lbl?`已核对：${esc(lbl)}${saved.updated?' · '+esc(saved.updated):''}`:'尚未核对'}</span>
   </div>
   <div class="feedback-drawer" style="display:${openDrawer?'block':'none'}">
     <div class="feedback">${feedbackForm(i.id)}</div>
   </div>
   ${hasDev?`<details class="dev-meta"><summary>查看原始图块与转录文本</summary><div class="dev-meta-body">
     <div class="input-links">${i.grid?`<button data-grid="${i.id}">查看拼图 ${esc(i.grid_id)}</button><span>缩放 ${(i.scale*100).toFixed(0)}%</span>`:''}<span>ID: ${esc(i.id)}</span></div>
     ${i.model_input?`<div style="margin:6px 0"><img class="crop" style="max-height:140px" src="${asset(i.model_input)}"></div>`:''}
     ${i.transcription?`<pre>${esc(i.kind==='identity'?`${i.transcription.name}\n${i.transcription.sid}`:Object.entries(i.transcription.answers).map(([s,b])=>Object.entries(b).map(([n,v])=>`${s} / ${n}：${v}`).join('\n')).join('\n'))}</pre>`:''}
   </div></details>`:''}
  </article>`;
 }).join('')||`<div class="card empty">${DATA.pages[pi].items.length?'当前筛选下没有题目，可切换为“全部题目”。':DATA.pages[pi].error?'本页处理失败，请查看上方错误信息。':'本页未找到可识别的答题区。'}</div>`;
 bindFeedback($('items'));
 document.querySelectorAll('[data-locate]').forEach(b=>b.onclick=()=>selectItem(b.dataset.locate,true));
 document.querySelectorAll('[data-image]').forEach(e=>e.onclick=()=>openImage(e.dataset.image,'原始裁图'));
 document.querySelectorAll('[data-grid]').forEach(e=>e.onclick=()=>{const i=DATA.pages[pi].items.find(i=>i.id===e.dataset.grid);openImage(i.grid,'豆包实际输入 · '+i.grid_id,`本题 ID ${i.id}，图内位置 ${i.grid_box.join('，')}。多个页面同题号通过ID区分。`)});
 renderMath();updatePosition();
}
function renderMath(){document.querySelectorAll('.mathtext').forEach(e=>{const v=e.dataset.value;e.textContent='';const parts=(!v.includes('$') && /\\(?:frac|sqrt|sum|int|mathrm|text|begin)\b/.test(v)) ? ['$'+v+'$'] : v.split(/(\$\$[\s\S]+?\$\$|\$[^$]+\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\])/g);for(const p of parts){if(!p)continue;let formula=null,display=false;if(p.startsWith('$$')){formula=p.slice(2,-2);display=true}else if(p.startsWith('$'))formula=p.slice(1,-1);else if(p.startsWith('\\(')||p.startsWith('\\[')){formula=p.slice(2,-2);display=p.startsWith('\\[')}const span=document.createElement('span');if(formula!==null){try{if(!window.katex)throw Error('公式显示组件未加载');katex.render(formula,span,{throwOnError:true,trust:false,displayMode:display})}catch(error){span.className='math-error';span.textContent='公式显示失败：'+error.message+'；原始转录：'+p;reportError('公式显示失败',error,DATA.pages[pi].name+' / '+e.closest('.item')?.id)}}else span.textContent=p;e.appendChild(span)}})}
function mapSize(){const r=$('map').getBoundingClientRect();return {width:r.width||600,height:r.height||700,left:r.left||0,top:r.top||0}}
function fitView(box){
 const size=mapSize(),aspect=size.width/size.height;
 const w=Math.max(box[2]-box[0],(box[3]-box[1])*aspect),h=w/aspect;
 return {x:(box[0]+box[2]-w)/2,y:(box[1]+box[3]-h)/2,w,h};
}
function fullView(){const p=DATA.pages[pi];return fitView([0,0,p.width||1,p.height||1])}
function zoomedView(old,factor,anchor){const base=fullView(),scale=Math.max(.25,Math.min(16,base.w/old.w*factor)),w=base.w/scale,h=w*old.h/old.w;return {x:old.x+old.w*anchor.x-w*anchor.x,y:old.y+old.h*anchor.y-h*anchor.y,w,h}}
function applyView(){const svg=$('map').querySelector('svg');if(!svg||!view)return;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);$('zoomReadout').textContent=Math.round(fullView().w/view.w*100)+'%'}
function resetPaper(){focused=false;view=fullView();drawMap()}
function focusPaper(){const i=DATA.pages[pi].items.find(i=>i.id===selected);if(!i)return;const b=i.box;view=fitView([b[0]-40,b[1]-45,b[2]+40,b[3]+45]);focused=true;drawMap()}
function zoomPaper(factor,anchor={x:.5,y:.5}){view=zoomedView(view||fullView(),factor,anchor);focused=false;drawMap()}
function drawMap(){
 const p=DATA.pages[pi];if(!p.image){$('map').textContent='本页没有可用图像';return}
 if(!view)view=fullView();const font=view.w/mapSize().width*12.5;
 const colors={choice:'#0F6E56',fill:'#4F46E5',identity:'#B45309',unmatched:'#B45309'};
 $('map').innerHTML=`<svg preserveAspectRatio="none" viewBox="${view.x} ${view.y} ${view.w} ${view.h}" xmlns="http://www.w3.org/2000/svg"><image href="${asset(p.image)}" width="${p.width}" height="${p.height}"/>${p.items.map(i=>{
 const b=i.box,c=colors[i.kind],isChoice=i.kind==='choice';
 const label=isChoice?`${i.number||'?'}：${i.answer||'未读出'}${i.issues.length?' ?':''}`:String(i.number||(i.kind==='identity'?'姓名学号':'未配对'));
 const show=!isChoice||$('showAnswers').checked;
 const x=b[0],y=Math.max(font+3,b[1]-font*.18),width=Math.max(font*2,[...label].length*font*.72+font*.5);
 return `<g class="hit" data-hit="${i.id}"><rect x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}" fill="${i.id===selected?c+'18':'transparent'}" stroke="${c}" stroke-width="${i.id===selected?2.5:1}" vector-effect="non-scaling-stroke"/>${show?`<g class="map-answer" data-answer-for="${i.id}"><rect x="${x}" y="${y-font}" width="${width}" height="${font*1.22}" rx="${font*.13}" fill="white" fill-opacity=".95"/><text x="${x+font*.16}" y="${y}" font-size="${font}" font-weight="600" fill="${isChoice&&i.issues.length?'#B45309':c}">${esc(label)}</text></g>`:''}</g>`;
 }).join('')}</svg>`;
 applyView();
}
function selectItem(id,zoom=false){
 selected=id;if(!visibleItems().some(i=>i.id===id)){$('itemFilter').value='all';drawItems()}
 document.querySelectorAll('.item.selected').forEach(e=>e.classList.remove('selected'));const card=$('item-'+id);card?.classList.add('selected');
 if(card){const list=$('items');list.scrollTop+=card.getBoundingClientRect().top-list.getBoundingClientRect().top-8}
 if(zoom)focusPaper();else drawMap();updatePosition();
}
function updatePosition(){const items=visibleItems();$('itemPosition').textContent=`${Math.max(0,items.findIndex(i=>i.id===selected)+1)} / ${items.length} 题`;}
function moveItem(delta){const items=visibleItems();if(!items.length)return;const old=items.findIndex(i=>i.id===selected);selectItem(items[Math.max(0,Math.min(items.length-1,old+delta))].id,focused)}
function openImage(path,title,meta=''){if(!path){toast('本页没有可用图像');return}$('bigImage').src=asset(path);$('imageTitle').textContent=title;$('imageMeta').textContent=meta;$('imageDialog').showModal()}
function stopDrag(){if(drag&&paper.hasPointerCapture?.(drag.pointerId))paper.releasePointerCapture(drag.pointerId);drag=null;paper.classList.remove('dragging')}
function showOverview(){stopDrag();if(lockedPageId){const pid=lockedPageId;lockedPageId=null;fetch('/api/release',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify({client_id:CLIENT_ID,page_id:pid})}).catch(()=>{})}document.documentElement.classList.remove('review-mode');document.body.classList.remove('review-mode');$('detail').style.display='none';$('overview').style.display='block';renderOverview();window.scrollTo(0,overviewScroll)}
function goBack(){
 if($('editSheetBackdrop')?.classList.contains('open')){closeEditSheet();return}
 if($('imageDialog').open){$('imageDialog').close();return}
 if(!document.body.classList.contains('review-mode'))return;
 stopDrag();const full=fullView();
 if(view&&['x','y','w','h'].some(k=>Math.abs(view[k]-full[k])>.01)){resetPaper();return}
 showOverview();
}
// 整批缩略图墙：按住 Ctrl + 滚轮缩放卡片宽度
let gridCardWidth = +(localStorage.getItem('reviewGridCardW') || 240);
function applyGridZoom(){
 gridCardWidth = Math.max(140, Math.min(440, Math.round(gridCardWidth)));
 $('pages').style.gridTemplateColumns = `repeat(auto-fill, minmax(${gridCardWidth}px, 1fr))`;
 try{localStorage.setItem('reviewGridCardW', String(gridCardWidth))}catch(_){}
 const h=$('gridZoomHint');if(h)h.textContent=`按住 Ctrl + 滚轮 缩放卡片（当前 ${gridCardWidth}px）`;
}
applyGridZoom();
window.addEventListener('wheel', e => {
 if(!e.ctrlKey || document.body.classList.contains('review-mode')) return;
 e.preventDefault();
 gridCardWidth += e.deltaY < 0 ? 24 : -24;
 applyGridZoom();
}, {passive:false});

// Apple 风格单张标框修改 Sheet
async function openEditSheet(){
 const p = DATA?.pages?.[pi];
 if(!p) return;
 const btn = $('editPageBoxBtn');
 if(btn){btn.disabled=true;btn.textContent='正在准备标框修改...';}
 try{
  const host = window.location.hostname || '127.0.0.1';
  const hub = `http://${host}:8888`;
  const r = await fetch(`${hub}/api/open-edit`, {
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({page_name: p.name})
  });
  const d = await r.json();
  if(!r.ok || !d.ok) throw new Error(d.error || '无法启动标框修改服务');
  const who = reviewerName();
  const qs = new URLSearchParams({stem: d.stem});
  if(who) qs.set('reviewer', who);
  const url = `http://${host}:${d.port}/?${qs.toString()}`;
  $('editSheetTitle').textContent = `单张标框修改：${p.name}`;
  $('editSheetNewTab').href = url;
  $('editSheetFrame').src = url;
  $('editSheetBackdrop').classList.add('open');
  $('editSheetBackdrop').setAttribute('aria-hidden', 'false');
 }catch(err){
  toast('打开标框修改失败（请确认工作台正在运行）：' + (err.message || err));
 }finally{
  if(btn){btn.disabled=false;btn.textContent='✎ 修改这张卷的标框';}
 }
}
function closeEditSheet(){
 const bd=$('editSheetBackdrop');if(!bd)return;
 bd.classList.remove('open');bd.setAttribute('aria-hidden','true');
 setTimeout(()=>{if(!bd.classList.contains('open'))$('editSheetFrame').src='about:blank';}, 260);
}
$('editPageBoxBtn')?.addEventListener('click', openEditSheet);
$('closeEditSheet')?.addEventListener('click', closeEditSheet);
$('editSheetBackdrop')?.addEventListener('click', e => { if(e.target === $('editSheetBackdrop')) closeEditSheet(); });
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.isComposing){e.preventDefault();goBack()}},true);
$('closeImage').onclick=()=>$('imageDialog').close();
$('pageFilter').onchange=renderPages;$('itemFilter').onchange=()=>{drawItems();drawMap()};
$('refresh').onclick=()=>load().catch(e=>reportError('刷新识别结果失败',e));
$('back').onclick=showOverview;
const _claimPageBtn=$('claimPageBtn');if(_claimPageBtn)_claimPageBtn.onclick=()=>claimNextPage().catch(e=>reportError('领取试卷失败',e));
const _nextClaimPage=$('nextClaimPage');if(_nextClaimPage)_nextClaimPage.onclick=()=>claimNextPage().catch(e=>reportError('领取试卷失败',e));
$('prevPage').onclick=()=>showPage(pi-1);$('nextPage').onclick=()=>showPage(pi+1);
$('prevItem').onclick=()=>moveItem(-1);$('nextItem').onclick=()=>moveItem(1);
$('fullPage').onclick=resetPaper;$('zoomItem').onclick=focusPaper;
$('zoomIn').onclick=()=>zoomPaper(1.3);$('zoomOut').onclick=()=>zoomPaper(1/1.3);
$('showAnswers').onchange=drawMap;
$('openRaw').onclick=()=>openImage(DATA.pages[pi].image,DATA.pages[pi].name);
const paper=$('map');
paper.addEventListener('wheel',e=>{e.preventDefault();const r=mapSize();zoomPaper(Math.exp(-Math.max(-180,Math.min(180,e.deltaY))*.003),{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})},{passive:false});
paper.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();paper.focus({preventScroll:true});drag={pointerId:e.pointerId,x:e.clientX,y:e.clientY,original:{...view},moved:false,hit:e.target.closest('[data-hit]')?.dataset.hit};paper.setPointerCapture?.(e.pointerId);paper.classList.add('dragging')};
paper.onpointermove=e=>{if(!drag||drag.pointerId!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;const size=mapSize();view={...drag.original,x:drag.original.x-dx/size.width*drag.original.w,y:drag.original.y-dy/size.height*drag.original.h};focused=false;applyView()};
paper.onpointerup=e=>{if(!drag||drag.pointerId!==e.pointerId)return;const old=drag;drag=null;paper.classList.remove('dragging');if(paper.hasPointerCapture?.(e.pointerId))paper.releasePointerCapture(e.pointerId);if(!old.moved&&old.hit)selectItem(old.hit,false)};
paper.onpointercancel=stopDrag;paper.onlostpointercapture=()=>{drag=null;paper.classList.remove('dragging')};
paper.ondblclick=e=>{const r=mapSize();zoomPaper(2,{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})};
paper.onkeydown=e=>{if(['+','=','-','f','F','0','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')zoomPaper(1.3);else if(e.key==='-')zoomPaper(1/1.3);else if(['f','F','0'].includes(e.key))resetPaper();else if(e.key.startsWith('Arrow')){const delta={ArrowLeft:[-.12,0],ArrowRight:[.12,0],ArrowUp:[0,-.12],ArrowDown:[0,.12]}[e.key];view.x+=view.w*delta[0];view.y+=view.h*delta[1];focused=false;applyView()}};
window.addEventListener('resize',()=>{if(!DATA||!document.body.classList.contains('review-mode'))return;if(focused)focusPaper();else resetPaper()});
window.addEventListener('beforeunload',e=>{releasePageBeacon();if(dirty.size){e.preventDefault();e.returnValue=''}});
load().catch(e=>reportError('加载识别结果失败',e));
</script>
